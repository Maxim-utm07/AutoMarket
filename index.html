<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <title>AutoMarket</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>AutoMarket</h1>
    <h2>Autentificare AutoMarket</h2>
    <p>Site pentru vânzarea automobilelor.</p>

    <h3>Autentificare</h3>

    <form>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Introdu emailul">

        <br><br>

        <label for="password">Parola:</label>
        <input type="password" id="password" placeholder="Introdu parola">

        <br><br>

        <button type="submit">Login</button>
    </form>

    <script src="script.js"></script>
</body>
</html>
